services:
  app:
    build: .
    command: bash -c "python src/preprocess.py && python src/train.py && python src/predict.py -m LOG_REG -t smoke && coverage run src/unit_tests && coverage report -m"
    ports:
      - 8001:8001
    image: derelia/big_data_lab_second:latest
    depends_on:
      - redis
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB}

  redis:
    image: redis:7.0-alpine
    ports:
      - "${REDIS_PORT:-6379}:${REDIS_PORT:-6379}"
    restart: always
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: redis-server --requirepass "${REDIS_PASSWORD}"

volumes:
  redis_data:
    driver: local
