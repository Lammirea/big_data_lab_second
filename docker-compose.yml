services:
  app:
    build: .
    command: bash -c "python src/preprocess.py && python src/train.py && python src/predict.py -m LOG_REG -t smoke && coverage run src/unit_tests/test_preprocess.py && coverage report -m"
    ports:
      - 8080:8080
    image: derelia/big_data_lab_second:latest
    depends_on:
      - redis
    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB}

  redis:
    image: redis:7.0-alpine
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis_data:/data
    environment:  # Исправлено форматирование
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD}

  jenkins:
      build:
        context: .
        dockerfile: Dockerfile.jenkins
      ports:
        - "8081:8080"  # Порт 8080 уже занят приложением
        - "5000:5000"
      volumes:
        - jenkins_data:/var/jenkins_home
        - /var/run/docker.sock:/var/run/docker.sock
      environment:
        TZ: Europe/Moscow
      networks:
        - jenkins-network
      restart: unless-stopped

volumes:
  redis_data:
  jenkins_data:

networks:
  jenkins-network: